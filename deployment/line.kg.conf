# Template for /etc/nginx/conf.d/line.kg.conf (inside Nginx's http context).
# Generate dist/ with python3 tools/build.py and publish only its contents.
# Adjust root and certificate paths after HTTPS certificates have been installed.
# Do not enable this template until nginx -t succeeds on the deployment server.

map $arg_lang $linekg_language {
    default en;
    ky ky;
}

map "$uri|$arg_v" $linekg_cache_control {
    default "no-cache";
    "~*\.(?:css|js)\|[a-f0-9]{12}$" "public, max-age=31536000, immutable";
    ~*\.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?|ttf|otf|eot)\| "public, max-age=604800";
}

server {
    listen 80;
    listen [::]:80;
    server_name line.kg www.line.kg;
    return 301 https://line.kg$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name line.kg www.line.kg;
    ssl_certificate /etc/letsencrypt/live/line.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/line.kg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/line.kg/dist;
    index index.html;
    server_tokens off;
    autoindex off;
    include /etc/nginx/mime.types;
    types { font/woff2 woff2; }
    default_type application/octet-stream;
    charset utf-8;

    # Copy this project's security-headers.conf to this absolute include path.
    include /etc/nginx/snippets/linekg-security-headers.conf;
    add_header Cache-Control $linekg_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_static on;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/xml image/svg+xml;

    error_page 404 =404 /_localized/$linekg_language/404.html;

    location = / {
        rewrite ^ /index.html last;
    }

    # Public URLs stay /index.html?lang=ky etc.; crawlers receive translated HTML.
    location = /index.html {
        limit_except GET HEAD { deny all; }
        try_files /_localized/$linekg_language/index.html =404;
    }
    location = /contact.html {
        limit_except GET HEAD { deny all; }
        try_files /_localized/$linekg_language/contact.html =404;
    }
    location = /privacy.html {
        limit_except GET HEAD { deny all; }
        try_files /_localized/$linekg_language/privacy.html =404;
    }

    location = /404.html { return 404; }

    # Generated language copies are implementation files, not additional public URLs.
    location ^~ /_localized/ { internal; }

    include /etc/nginx/snippets/linekg-language-redirects.conf;

    # Defense in depth: even if extra source files are accidentally uploaded.
    location ~ /$ { return 404; }
    location ~ (^|/)\. { return 404; }
    location ~* ^/(?:tools|tests|deployment|canvases|node_modules|\.linekg-build)(?:/|$) { return 404; }
    location ~* \.(?:py|md|tsx?|scss|map|pem|key|env|bak|old|log|conf)$ { return 404; }
    location ~* /(?:README|backup)\.txt$ { return 404; }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
}
