name: Deploy to GitHub Pages

on:
  # Production uses the built-in Pages build from gh-pages. Custom Actions jobs
  # are currently blocked by the account's billing lock. Publish with
  # python3 tools/publish-pages.py until the lock has been resolved.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build dist/
        run: python3 tools/pages.py
      - name: Keep custom domain
        run: echo "line.kg" > dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
